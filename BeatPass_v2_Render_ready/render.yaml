services:
  - type: web
    name: beatpass-v2-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m alembic upgrade head && python -m backend.cli bootstrap-render-admin && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beatpass-v2-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: MAIL_MODE
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAYMENT_MODE
        value: disabled
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: BEATPASS_BOOTSTRAP_ADMIN_ENABLED
        value: 'false'
      - key: BEATPASS_BOOTSTRAP_ADMIN_EMAIL
        value: pruebas@beatpass.com
      - key: BEATPASS_BOOTSTRAP_ADMIN_NAME
        value: Equipo BeatPass
      - key: BEATPASS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
  - type: web
    name: beatpass-v2-web
    runtime: static
    buildCommand: python tools/build_components.py --check && python tools/build_static.py
    staticPublishPath: ./public
    envVars:
      - key: API_BASE_URL
        sync: false

databases:
  - name: beatpass-v2-db
    plan: free
