<!-- FLUJO: Tarjeta de demostración; build_components.py la rellena desde demo-events.json. -->
<!-- Organismo: tarjeta de evento clicable como una sola unidad accesible. -->
<article class="event-card bp-event-card">
  <a class="bp-event-card__link" href="event-detail.html?id={{ID}}" aria-label="Ver información de {{TITLE}}">
    <div class="event-image-wrapper">
      <img src="{{IMAGE}}" class="event-image" alt="Imagen del evento {{TITLE}}" loading="lazy">
      <span class="event-category">{{CATEGORY}}</span>
    </div>
    <div class="event-card-content">
      <h3 class="event-card-title">{{TITLE}}</h3>
      <div class="event-card-details">
        <span class="card-detail">📅 {{DATE}} · {{TIME}}</span>
        <span class="card-detail">📍 {{VENUE}}</span>
      </div>
      <div class="event-card-footer">
        <span class="bp-price-from"><span>Desde</span><strong>${{PRICE}}</strong></span>
        <span class="bp-card-cta" aria-hidden="true">Explorar evento <span>→</span></span>
      </div>
    </div>
  </a>
</article>
