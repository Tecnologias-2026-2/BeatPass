name: Verificaciones BeatPass
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      MAIL_MODE: development
      PAYMENT_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q tests/test_phase2a.py tests/test_phase2b.py tests/test_phase2c.py tests/test_phase2d.py tests/test_phase2e.py tests/test_phase2e_optimizations.py tests/test_profile.py tests/test_zz_render_readiness.py
      - run: python tools/build_components.py --check
      - run: python tests/verify_structure.py
      - run: node tests/verify_core.js
      - run: node tests/verify_phase2d.js
